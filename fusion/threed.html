<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; }
  #v { width: 100%; height: 100%; }
  html.embed, html.embed body, html.embed #v canvas { background: transparent !important; }
  html.embed #geometry-note { display: none; }
  #geometry-note { position: absolute; top: 10px; left: 10px; right: 10px;
    width: fit-content; max-width: calc(100% - 40px); padding: 7px 10px;
    border: 1px solid #dbe2e8; border-radius: 6px; background: rgba(255,255,255,.94);
    color: #465462; font: 12px/1.5 -apple-system, sans-serif; pointer-events: none; }
  #geometry-note[hidden] { display: none; }
</style>
<script src="/vendor/ngl.js"></script>
</head>
<body>
<div id="v"></div>
<div id="geometry-note" role="note" hidden></div>
<script>
/* 3D 渲染：NGL（MIT，RCSB 官方在用）
   手势全部在页面内处理 —— 不再走 Swift→JS 的 IPC，这是之前卡顿的根因 */
const stage = new NGL.Stage("v", {
  backgroundColor: "#fafafa",
  tooltip: false,
  impostor: true,        // 实例化渲染，球/棍都是 impostor，非常快
  quality: "medium"
});
stage.setParameters({ clipNear: 0 });

/* 无头验证/调参钩子（正常从 app 启动无 query，走默认参数）：
   ?noimp → 关 impostor 改用真实网格几何（软件渲染下 impostor 有伪影，截图不可信）
   ?p={"radiusScale":0.2,...} → 覆盖球棍参数，用于调参 */
const QS = new URLSearchParams(location.search);
if (QS.get("embed")) document.documentElement.classList.add("embed");
const TUNE = (() => { try { return JSON.parse(QS.get("p") || "{}"); } catch (e) { return {}; } })();
if (QS.has("noimp")) stage.setParameters({ impostor: false });

let showSeq = 0;
let comp = null;

/* 用 NGL 自己的相机控制（与它内置 panDrag/zoomScroll 同一套 API） */
function pan(dx, dy) { try { stage.trackballControls.pan(dx, dy); } catch (e) {} }
function zoomFactor(f) {
  // 用绝对距离缩放，避免 trackballControls.zoom(delta) 的语义歧义
  try {
    const vc = stage.viewerControls;
    const cur = vc.getCameraDistance();
    vc.distance(Math.max(0.5, Math.min(500, cur / f)));
  } catch (e) {}
}
function spinZ(deg) { try { stage.viewerControls.spin([0, 0, 1], deg * Math.PI / 180); } catch (e) {} }

const STYLE_MAP = {
  ballstick: "ball+stick",
  stick: "licorice",
  line: "line",
  sphere: "spacefill"
};

window.k3d = {
  show: (block, style) => {
    const seq = ++showSeq;
    const title = block.split(/\r?\n/, 1)[0];
    const geometryNote = document.getElementById('geometry-note');
    geometryNote.hidden = !title.startsWith('MolStudio 参考几何：');
    geometryNote.textContent = geometryNote.hidden ? '' : title.slice('MolStudio 参考几何：'.length);
    if (!geometryNote.hidden && title.includes('XeF6')) geometryNote.textContent += '；高对称参考模型，实际构型可畸变';
    if (style) window.__lastStyle = STYLE_MAP[style] ? style : "ballstick";  // 显式样式参数即时更新期望值
    stage.removeAllComponents();
    comp = null;                    // load 期间 style() 不再往游离组件上加表示
    const blob = new Blob([block], { type: "text/plain" });
    window.__loadError = null;
    return stage.loadFile(blob, { ext: "sdf" }).then(c => {
      if (seq !== showSeq) return;  // 已有更新的 show，丢弃本次 load
      comp = c;
      window.k3d.style(window.__lastStyle || "ballstick");  // 加载完成时读取最新期望样式，不用闭包捕获的旧选择
      stage.autoView(0);
      stage.handleResize();
      return new Promise(resolve => stage.tasks.onZeroOnce(resolve));
    }).catch(e => {
      if (seq !== showSeq) return;
      window.__loadError = String((e && e.message) || e);  // molblock 非法不再静默白屏
      console.error("k3d loadFile failed:", e);
      if (QS.get("embed")) throw e;
    });
  },
  style: s => {
    window.__lastStyle = s;
    if (!comp) return;
    comp.removeAllRepresentations();
    // 注意：先归一化到 STYLE_MAP 的键名再分支 —— 之前拿映射后的 NGL 类型名
    // 去和键名比较，"stick" 分支永远不成立，棍状模型一直错误渲染成填充模型
    const key = STYLE_MAP[s] ? s : "ballstick";
    const NOIMP = QS.has("noimp");
    if (key === "ballstick") {
      // 真·球棍（NGL 源码语义）：原子半径 = 元素vdW × radiusScale × aspectRatio，
      // 键半径 = 基径 × radiusScale（不乘 aspectRatio）→ F < Cl < Br < I 球径天然可辨；
      // multipleBond symmetric → 双键渲染为对称双棍（bondScale 每根粗细占比，bondSpacing 间距）
      comp.addRepresentation("ball+stick", Object.assign({
        colorScheme: "element",
        radiusType: "vdw",       // 球基径 = 元素 vdW（radiusSize 只对 radiusType:"size" 生效，勿混用）
        radiusScale: 0.104,      // C 球 = 1.7×0.104×2.75 ≈ 0.49 Å（球不变），键棍 ≈ 0.18 Å（再细 20%）
        aspectRatio: 2.75,       // 球/棍半径比 ↑ = 棍相对更细（用户第二次要求细化）
        multipleBond: "symmetric",
        bondScale: 0.4,
        bondSpacing: 1,
        sphereDetail: 2,
        disableImpostor: NOIMP
      }, TUNE));
    } else if (key === "stick") {
      // 棍状：licorice = ball+stick aspectRatio 强制 1，radiusType size → 均匀细棍+细球节点
      comp.addRepresentation("licorice", Object.assign({
        colorScheme: "element",
        radiusType: "size",
        radiusSize: 0.14,
        multipleBond: "symmetric",
        bondScale: 0.4,
        bondSpacing: 1,
        disableImpostor: NOIMP
      }, TUNE));
    } else if (key === "line") {
      comp.addRepresentation("line", { colorScheme: "element", multipleBond: "symmetric" });
    } else {
      // 填充模型：默认即全尺寸 vdW CPK
      comp.addRepresentation("spacefill", Object.assign({
        colorScheme: "element", radiusType: "vdw", radiusScale: 1.0, disableImpostor: NOIMP
      }, TUNE));
    }
    window.__reps = key + "→" + STYLE_MAP[key];
    stage.viewer.requestRender();
  },
  pan: (dx, dy) => pan(-dx, -dy),
  zoomBy: f => zoomFactor(f),
  rotateBy: deg => spinZ(deg),
  rotateXY: (dx, dy) => {
    // 该构建 viewerControls.rotate(q) 是绝对设姿（不与当前姿态复合，第二次直接覆盖第一次），
    // 必须用增量 API spin(axis, angle)（= rotateOnAxis，NGL 动画控制器同款）
    try {
      stage.viewerControls.spin([0, 1, 0], dx * 0.008);
      stage.viewerControls.spin([1, 0, 0], dy * 0.008);
    } catch (e) {}
  },
  spin: on => { try { stage.setSpin(!!on); } catch (e) {} },  // 该构建 setSpin 只收单布尔，多余参数被忽略
  reset: () => { stage.viewerControls.rotate([0, 0, 0, 1]); stage.autoView(0); }
};

/* 手势：全部交给 NGL 内置鼠标控制（拖拽旋转 / 滚轮缩放 / 右键拖拽平移） */
/* 调试：统计真实拖拽到达页面的增量 */
window.__dbg = { down: 0, move: 0, dx: 0, dy: 0, lastX: null, lastY: null };
document.addEventListener("mousedown", e => { window.__dbg.down++; window.__dbg.lastX = e.clientX; window.__dbg.lastY = e.clientY; }, true);
document.addEventListener("mousemove", e => {
  const d = window.__dbg;
  d.move++;
  if (d.lastX !== null) { d.dx += e.clientX - d.lastX; d.dy += e.clientY - d.lastY; }
  d.lastX = e.clientX; d.lastY = e.clientY;
}, true);
document.addEventListener("mouseup", () => { window.__dbg.lastX = null; window.__dbg.lastY = null; }, true);

/* 双指滑动 = 平移（用 NGL 自己的 pan）；捏合/ctrl+滚轮 = 缩放 */
/* 移除 NGL 内置滚轮绑定：普通滚轮缩放 + shift/ctrl 修饰键路径
   （scroll-shift→focusScroll 会动裁剪焦点把分子"切"出断层、scroll-ctrl→isolevelScroll 等） */
["scroll", "scroll-shift", "scroll-ctrl", "scroll-shift-ctrl"].forEach(t => {
  try { stage.mouseControls.remove(t); } catch (e) {}
});
const viewport = document.getElementById("v");
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : 1;
  if (e.ctrlKey) {
    zoomFactor(Math.exp(-(e.deltaY * k) * 0.0025));
  } else {
    pan(e.deltaX * k, e.deltaY * k);      // 方向：内容跟手（上下左右已翻正）
  }
}, { passive: false, capture: true });

window.addEventListener("resize", () => stage.handleResize());
new ResizeObserver(() => {
  stage.handleResize();
}).observe(document.getElementById("v"));
</script>
<script>
/* 内嵌交互总线（embed=1）：供宿主页面经 postMessage 控制 3D 视口并取快照。
   只增不改：上方 window.k3d.* 与原生窗口注入路径行为完全不变。 */
(function () {
  const QS2 = new URLSearchParams(location.search);
  if (!QS2.get("embed")) return;

  // 内嵌模式：隐藏页面级说明横幅（geometry-note），只保留 stage 视口
  const note = document.getElementById("geometry-note");
  if (note) note.hidden = true;

  // 快照 / 相机均走 NGL 真实 API：
  // - stage.makeImage(params) → Promise<Blob>（PNG）
  // - stage.viewerControls：get position（translationGroup.position）、getCameraDistance()、distance(e)
  function viewerCamera() {
    const vc = stage.viewerControls;
    const pos = vc.position; // getter → viewer.translationGroup.position
    return {
      px: Math.round(pos.x * 10000) / 10000,
      py: Math.round(pos.y * 10000) / 10000,
      pz: Math.round(pos.z * 10000) / 10000,
      distance: Math.round(vc.getCameraDistance() * 10000) / 10000,
      qx: vc.rotation.x, qy: vc.rotation.y, qz: vc.rotation.z, qw: vc.rotation.w
    };
  }
  function applyViewerCamera(cam) {
    if (!cam || typeof cam !== "object") return false;
    const nums = [cam.px, cam.py, cam.pz, cam.distance];
    if (!nums.every(n => typeof n === "number" && isFinite(n)) || cam.distance <= 0) return false;
    const vc = stage.viewerControls;
    const keys = ['qx', 'qy', 'qz', 'qw'];
    if (keys.some(key => cam[key] !== undefined)) {
      if (!keys.every(key => Number.isFinite(cam[key]))) return false;
      const length = Math.hypot(...keys.map(key => cam[key]));
      if (length < 1e-8) return false;
      vc.rotate(keys.map(key => cam[key] / length));
    }
    vc.position.set(cam.px, cam.py, cam.pz); // 原地写回 translationGroup.position
    vc.distance(cam.distance);
    return true;
  }
  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error("快照读取失败"));
      reader.readAsDataURL(blob);
    });
  }

  // 文档图裁剪透明 alpha 包围盒，再等比居中放进原视口尺寸；不拉伸，也不铺白底。
  // 最长方向留约 6% 透明边，避免分子贴边。独立 3D 快照不启用此处理。
  function trimTransparentToFrame(dataURL, width, height) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => {
        try {
          const sourceWidth = image.naturalWidth || image.width;
          const sourceHeight = image.naturalHeight || image.height;
          const outputWidth = Math.max(1, Math.round(width || sourceWidth));
          const outputHeight = Math.max(1, Math.round(height || sourceHeight));
          const source = document.createElement('canvas');
          source.width = sourceWidth; source.height = sourceHeight;
          const sourceContext = source.getContext('2d', { willReadFrequently: true });
          sourceContext.drawImage(image, 0, 0);
          const rgba = sourceContext.getImageData(0, 0, sourceWidth, sourceHeight).data;
          let minX = sourceWidth, minY = sourceHeight, maxX = -1, maxY = -1;
          for (let y = 0; y < sourceHeight; y++) {
            for (let x = 0; x < sourceWidth; x++) {
              // Ignore only fully transparent / near-zero AA noise; preserve antialiased edges.
              if (rgba[(y * sourceWidth + x) * 4 + 3] <= 2) continue;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
          // A blank WebGL frame remains a valid transparent snapshot at the requested dimensions.
          if (maxX < minX || maxY < minY) {
            const blank = document.createElement('canvas');
            blank.width = outputWidth; blank.height = outputHeight;
            resolve(blank.toDataURL('image/png')); return;
          }
          const boundsWidth = maxX - minX + 1, boundsHeight = maxY - minY + 1;
          const target = document.createElement('canvas');
          target.width = outputWidth; target.height = outputHeight;
          const context = target.getContext('2d');
          const scale = Math.min(outputWidth * 0.88 / boundsWidth, outputHeight * 0.88 / boundsHeight);
          const drawWidth = boundsWidth * scale, drawHeight = boundsHeight * scale;
          const x = (outputWidth - drawWidth) / 2, y = (outputHeight - drawHeight) / 2;
          context.clearRect(0, 0, outputWidth, outputHeight);
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = 'high';
          context.drawImage(source, minX, minY, boundsWidth, boundsHeight, x, y, drawWidth, drawHeight);
          resolve(target.toDataURL('image/png'));
        } catch (error) { reject(error); }
      };
      image.onerror = () => reject(new Error('透明边距裁剪失败'));
      image.src = dataURL;
    });
  }

  const HANDLED = ["hello", "show", "style", "reset", "spin", "snapshot", "camera-get", "camera-set", "dispose"];
  function reply(id, ok, extra) {
    // 校验 source 为父窗口
    const target = (window.parent && window.parent !== window) ? window.parent : null;
    if (!target) return;
    target.postMessage(Object.assign({ type: "k3d-embed-result", id, ok: !!ok }, extra || {}), "*");
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;  // 只接受父窗口
    const data = event.data;
    if (!data || typeof data !== "object" || data.type !== "k3d-embed") return;
    const id = data.id;
    if (!HANDLED.includes(data.action)) {
      reply(id, false, { error: "未知的 embed action：" + data.action });
      return;
    }
    Promise.resolve().then(() => {
      switch (data.action) {
        case "hello":
        case "dispose":
          if (data.action === "dispose") { try { stage.dispose(); } catch (e) {} }
          return;
        case "show":
          return window.k3d.show(data.molblock, data.style);
        case "style":
          window.k3d.style(data.style);
          return;
        case "reset":
          window.k3d.reset();
          return;
        case "spin":
          window.k3d.spin(!!data.on);
          return;
        case "snapshot": {
          // makeImage 只收 trim/factor/antialias/transparent；视口 resize 和 alpha 裁剪仅供请求方显式启用。
          const w = data.width, h = data.height;
          // Alpha 裁边会放大分子在最终帧中的像素占比；用 3× WebGL 输出再缩小，避免低分辨率放大变糊。
          const factor = data.trim === true ? 3 : 1;
          const vp = document.getElementById("v");
          const doSnap = () => stage.makeImage({ trim: false, factor, transparent: true })
            .then(blobToDataURL)
            .then(dataURL => data.trim === true
              ? trimTransparentToFrame(dataURL, w > 0 ? w : vp.clientWidth, h > 0 ? h : vp.clientHeight)
              : dataURL);
          if (!(w > 0 && h > 0)) return doSnap().then(dataURL => ({ dataURL }));
          const oldW = vp.style.width, oldH = vp.style.height;
          stage.setSize(Math.round(w) + "px", Math.round(h) + "px");
          return new Promise(res => setTimeout(res, 120)).then(doSnap).then(dataURL => {
            stage.setSize(oldW || "", oldH || "");
            return { dataURL };
          }, err => {
            stage.setSize(oldW || "", oldH || "");
            throw err;
          });
        }
        case "camera-get":
          return { camera: viewerCamera() };
        case "camera-set":
          if (!applyViewerCamera(data.camera)) throw new Error("camera 数据无效");
          return;
        default:
          throw new Error("未知的 embed action：" + data.action);
      }
    }).then(extra => reply(id, true, extra || {}))
      .catch(err => reply(id, false, { error: String((err && err.message) || err) }));
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      window.parent.postMessage({ type: 'k3d-embed-cancel' }, '*');
    }
  });

  // 加载完成后主动向宿主报 hello（宿主凭它触发 show）
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "k3d-embed", id: 0, action: "hello" }, "*");
  }
})();
</script>
</body>
</html>
