name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canvas-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: |
          npm --prefix fusion ci --ignore-scripts
          npm --prefix fusion/agent ci --ignore-scripts

      - name: Run JavaScript unit and document tests
        run: npm --prefix fusion test

      - name: Install Python dependencies
        run: python -m pip install --only-binary :all: -r fusion/requirements.txt

      - name: Run Python chemistry and server tests
        run: |
          python -B fusion/tests/test_conservative_layout.py
          python -B fusion/tests/test_stereo.py
          python -B -m unittest discover -s fusion/tests -p 'test_*.py'
